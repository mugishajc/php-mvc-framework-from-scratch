name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint
        run: find src app bin config bootstrap routes public tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Smoke test the demo app
        run: |
          php bin/migrate
          php -S 127.0.0.1:8000 -t public > /tmp/server.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8000/tasks | grep -q 'New task'
          curl -fsS http://127.0.0.1:8000/api/tasks
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -d 'title=x' http://127.0.0.1:8000/tasks)
          test "$status" = "419"
